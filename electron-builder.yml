appId: com.lessiskou.less-todo-window
productName: Less Todo
directories:
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/LXGW-WenKai-OFL.txt
    to: LXGW-WenKai-OFL.txt
publish:
  provider: github
  owner: lessiskou
  repo: less-todo-window
  releaseType: release
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Less Todo
