appId: com.lessiskou.less-todo-window
productName: Less Todo
directories:
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tray.png
    to: tray.png
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Less Todo
